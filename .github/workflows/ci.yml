name: CI

on:
  push:
    branches:
      - master
      - "cd/**"
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Format check
        run: bun run format:check

      - name: Type check
        run: bun run type-check

      - name: Dead-code / unused-deps check
        run: bun run knip

      - name: Test
        run: bun test

      - name: Build
        run: SKIP_ENV_VALIDATION=1 bun run build
